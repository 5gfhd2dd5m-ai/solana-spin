<!-- DEMO RESULT -->
<div id="prizeModal" class="modal">
  <div class="modal-content">

    <h2>🎉 Congratulations!</h2>

    <p>Your demo winning reward:</p>

    <div class="reward-amount">5 SOL</div>

    <p>
      This is a demonstration only. No SOL is transferred.
    </p>

    <button class="claim-btn" onclick="closePrizeModal()">
      OK →
    </button>

    <button class="close-btn" onclick="closePrizeModal()">
      Close
    </button>

  </div>
</div>

<script>
const DEMO_PRIZE = "5 SOL";

function openModal() {
  const modal = document.getElementById("prizeModal");
  if (modal) modal.style.display = "flex";
}

function closePrizeModal() {
  const modal = document.getElementById("prizeModal");
  if (modal) modal.style.display = "none";
}

function spin() {
  const result = document.getElementById("result");

  if (result) {
    result.innerHTML =
      "🎉 Congratulations! You won <strong>5 SOL</strong>!<br><small>DEMO</small>";
  }

  setTimeout(() => {
    openModal();
  }, 500);
}
</script>
